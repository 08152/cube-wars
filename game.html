
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CUBE WARS</title>

    <link rel="stylesheet" href="./ui.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #111722;
        }

        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        #player-data {
            display: none;
        }

        #game-info {
            display: none;
        }

        #inventory {
            display: none;
        }

        #weapon-info {
            display: none;
        }

        #pause-menu,
        #death-menu {
            display: none;
        }

        #game-loading {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 18px;
            background:
                radial-gradient(
                    circle at center,
                    #233b59 0%,
                    #101722 65%,
                    #080d15 100%
                );
        }

        .loading-title {
            font-size: clamp(35px, 7vw, 75px);
            font-weight: 1000;
            letter-spacing: 5px;
            color: white;
            text-shadow: 0 0 30px #168cff;
        }

        .loading-subtitle {
            color: #9cb9d5;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        #loading-bar {
            width: 240px;
            height: 7px;
            background: #26384c;
            border-radius: 10px;
            overflow: hidden;
        }

        #loading-progress {
            width: 0%;
            height: 100%;
            background: #27aaff;
            box-shadow: 0 0 15px #27aaff;
            animation: loading 0.8s ease forwards;
        }

        @keyframes loading {
            to {
                width: 100%;
            }
        }

        #loading-text {
            font-size: 11px;
            color: #c6d8e9;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <!-- SPIEL-CANVAS -->

    <canvas id="game-canvas"></canvas>


    <!-- LADEBILDSCHIRM -->

    <div id="game-loading">

        <div class="loading-title">
            CUBE WARS
        </div>

        <div class="loading-subtitle">
            BATTLE ROYALE
        </div>

        <div id="loading-bar">
            <div id="loading-progress"></div>
        </div>

        <div id="loading-text">
            SPIEL WIRD GELADEN ...
        </div>

    </div>


    <!-- HUD -->

    <div id="ui-layer">

        <!-- FADENKREUZ -->

        <div id="crosshair"></div>


        <!-- SPIELERSTATUS -->

        <div id="player-data">

            <div id="player-status">

                <div class="status-label">
                    <span>LEBEN</span>
                    <span id="health-value">100</span>
                </div>

                <div id="health-container">
                    <div id="health-bar"></div>
                </div>

            </div>


            <!-- SCHILD -->

            <div id="shield-status">

                <div class="status-label">
                    <span>SCHILD</span>
                    <span id="shield-value">100</span>
                </div>

                <div id="shield-container">
                    <div id="shield-bar"></div>
                </div>

            </div>


            <!-- AUSDAUER -->

            <div id="stamina-status">

                <div class="status-label">
                    <span>AUSDAUER</span>
                    <span id="stamina-value">100</span>
                </div>

                <div id="stamina-container">
                    <div id="stamina-bar"></div>
                </div>

            </div>

        </div>


        <!-- SPIELINFORMATIONEN -->

        <div id="game-info">

            <div id="player-name">
                SPIELER
            </div>

            <div id="kill-counter">
                ELIMINIERUNGEN: 0
            </div>

            <div id="enemy-counter">
                GEGNER: 0
            </div>

        </div>


        <!-- INVENTAR -->

        <div id="inventory">

            <div class="inventory-slot active" data-slot="1">
                1
            </div>

            <div class="inventory-slot" data-slot="2">
                2
            </div>

            <div class="inventory-slot" data-slot="3">
                3
            </div>

            <div class="inventory-slot" data-slot="4">
                4
            </div>

            <div class="inventory-slot" data-slot="5">
                5
            </div>

        </div>


        <!-- WAFFENANZEIGE -->

        <div id="weapon-info">

            <div id="weapon-name">
                ENERGIEBLASTER
            </div>

            <div id="ammo">
                30 <span>/ 30</span>
            </div>

        </div>


        <!-- BENACHRICHTIGUNGEN -->

        <div id="notification-container"></div>

    </div>


    <!-- PAUSENMENÜ -->

    <div id="pause-menu">

        <div class="pause-panel">

            <h2>PAUSE</h2>

            <p>Das Spiel wurde pausiert.</p>

            <button id="resume-button">
                WEITERSPIELEN
            </button>

            <button id="menu-button">
                ZUR LOBBY
            </button>

        </div>

    </div>


    <!-- TODESMENÜ -->

    <div id="death-menu">

        <div class="pause-panel">

            <h2>ELIMINIERT</h2>

            <p>Du wurdest besiegt.</p>

            <button id="respawn-button">
                ERNEUT SPIELEN
            </button>

            <button id="death-lobby-button">
                ZUR LOBBY
            </button>

        </div>

    </div>


    <!-- THREE.JS -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
    }
    </script>


    <!-- SPIELSYSTEME -->

    <script type="module" src="./ui.js"></script>
    <script type="module" src="./game.js"></script>

</body>

</html>
