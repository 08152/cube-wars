
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CUBE WARS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
        }

        body {
            position: relative;
        }

        /* Spielfläche */
        #game-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 3D-Spielbereich */
        #game-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI-Ebene */
        #ui-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* Fadenkreuz */
        #crosshair {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: none;
            font-size: 25px;
            color: white;
        }

        /* Spielerinformationen */
        #player-data {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: none;
        }

        /* Lebensanzeige */
        #health-container {
            width: 220px;
            height: 17px;
            background: #252525;
            border: 2px solid white;
            border-radius: 5px;
            overflow: hidden;
        }

        #health-bar {
            height: 100%;
            width: 100%;
            background: #39e66c;
            transition: width .2s;
        }

        /* Ausdauer */
        #stamina-container {
            width: 220px;
            height: 8px;
            background: #252525;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
        }

        #stamina-bar {
            height: 100%;
            width: 100%;
            background: #36baff;
        }

        /* Spielerstatus */
        #player-status {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
        }

        /* Spielinformationen */
        #game-info {
            position: absolute;
            top: 20px;
            right: 25px;
            text-align: right;
            display: none;
        }

        /* Inventar */
        #inventory {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 6px;
        }

        .inventory-slot {
            width: 58px;
            height: 58px;
            background: #172432bb;
            border: 2px solid #8da7b8;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .inventory-slot.active {
            border: 3px solid #ffffff;
            background: #318bc9aa;
        }

        /* Lade-/Startsystem */
        #game-loading {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #071522;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
        }

        #game-loading h1 {
            font-size: 45px;
            letter-spacing: 8px;
            color: #42bfff;
        }

        #loading-text {
            color: #b6d5e8;
            font-size: 13px;
            letter-spacing: 3px;
        }

        /* Pause */
        #pause-menu {
            position: fixed;
            inset: 0;
            z-index: 90;
            background: #000b;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .pause-panel {
            width: 350px;
            padding: 30px;
            background: #172a3b;
            border: 1px solid #38baff;
            border-radius: 15px;
            text-align: center;
        }

        .pause-panel h2 {
            margin-bottom: 25px;
            color: #45bfff;
            letter-spacing: 4px;
        }

        .pause-panel button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: 0;
            border-radius: 7px;
            background: #168ed0;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Versteckte Elemente */
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- SPIELCONTAINER -->
    <main id="game-container">

        <!-- 3D-CANVAS -->
        <canvas id="game-canvas"></canvas>

    </main>


    <!-- UI -->
    <div id="ui-layer">

        <!-- Fadenkreuz -->
        <div id="crosshair">+</div>


        <!-- SPIELERDATEN -->
        <section id="player-data">

            <div id="player-status">
                SPIELER
            </div>

            <div id="health-container">
                <div id="health-bar"></div>
            </div>

            <div id="stamina-container">
                <div id="stamina-bar"></div>
            </div>

        </section>


        <!-- SPIELINFORMATIONEN -->
        <section id="game-info">

            <div id="player-name">
                CUBE WARS
            </div>

            <div id="kill-counter">
                ELIMINIERUNGEN: 0
            </div>

            <div id="enemy-counter">
                GEGNER: 0
            </div>

        </section>


        <!-- INVENTAR -->
        <section id="inventory">

            <div class="inventory-slot active" data-slot="1">1</div>
            <div class="inventory-slot" data-slot="2">2</div>
            <div class="inventory-slot" data-slot="3">3</div>
            <div class="inventory-slot" data-slot="4">4</div>
            <div class="inventory-slot" data-slot="5">5</div>

        </section>

    </div>


    <!-- LADEANZEIGE -->
    <div id="game-loading">

        <h1>CUBE WARS</h1>

        <div id="loading-text">
            SPIEL WIRD INITIALISIERT
        </div>

    </div>


    <!-- PAUSENMENÜ -->
    <div id="pause-menu">

        <div class="pause-panel">

            <h2>PAUSE</h2>

            <button id="resume-button">
                WEITERSPIELEN
            </button>

            <button id="menu-button">
                ZURÜCK ZUR LOBBY
            </button>

        </div>

    </div>


    <!-- THREE.JS -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
    }
    </script>


    <!-- SPIELSYSTEM -->
    <script type="module" src="./game.js"></script>

    <!-- UI-SYSTEM -->
    <script type="module" src="./ui.js"></script>

</body>
</html>
